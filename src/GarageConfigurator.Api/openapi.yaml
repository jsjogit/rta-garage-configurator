openapi: 3.0.3
info:
  title: RTA Garage Wall Solver API
  version: 1.0.0
  description: >
    Solves a garage wall into complete, priced, buildable cabinet layouts from the Signature Gray
    line, and stores a design so it can be shared or reloaded. Dimensions are inches as decimals;
    money is decimal USD. Prices are applied per request, never stored with a layout.
servers:
  - url: /api
paths:
  /solve:
    post:
      operationId: solve
      summary: Solve a wall into up to three ranked, priced layouts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveRequest' }
      responses:
        '200':
          description: Up to three layouts, or none with a failure reason the customer can read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResponse' }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /validate:
    post:
      operationId: validate
      summary: Check an edited layout against the design rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: Violations, empty when the layout is buildable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResponse' }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /price:
    post:
      operationId: price
      summary: Price a layout at current prices.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceRequest' }
      responses:
        '200':
          description: Line items rolled up by SKU, with list and promotional subtotals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricedLayout' }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /swaps/{sku}:
    get:
      operationId: swaps
      summary: Alternatives for one cabinet — same zone, same width.
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: What may go in this cabinet's place without the wall moving.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku: { type: string }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string, description: Empty for an open knee space. }
                        name: { type: string }
                        zone: { type: string }
                        width: { type: number, format: double }
                        height: { type: number, format: double }
                        depth: { type: number, format: double }
        '400':
          description: Not a cabinet we carry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /cart:
    post:
      operationId: cart
      summary: The add-to-cart posts the storefront should make for this wall.
      description: >
        nopCommerce adds to cart by integer product id and the solver only knows SKUs, so the store
        supplies a SKU-to-id map. If any SKU is unmapped, ready is false, requests is empty and
        unmappedSkus names what is missing — we never add part of a wall.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout: { $ref: '#/components/schemas/Layout' }
                configId: { type: string, nullable: true }
      responses:
        '200':
          description: The hand-off, ready or not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartHandoff' }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /lead:
    post:
      operationId: lead
      summary: Email me this design, or have a designer pick it up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, email]
              properties:
                kind: { type: string, enum: [EmailMe, DesignerHelp] }
                email: { type: string }
                configId: { type: string, nullable: true }
                name: { type: string, nullable: true }
                message: { type: string, nullable: true }
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /events:
    post:
      operationId: events
      summary: Record one funnel step (SPEC.md) as an App Insights custom event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  enum:
                    - wizard_started
                    - wall_defined
                    - layouts_returned
                    - layout_viewed
                    - layout_edited
                    - cart_add_all
                    - cart_add_item
                    - share_created
                    - lead_captured
                configId: { type: string, nullable: true }
                properties:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '202':
          description: Recorded.
        '400':
          description: The event had no name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /design:
    post:
      operationId: saveDesign
      summary: Store a design and get back a short shareable code.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDesignRequest' }
      responses:
        '200':
          description: The config id for /garage/design/{configId}.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configId: { type: string, example: 7K2MQ4, minLength: 6, maxLength: 6 }
        '400':
          description: The request could not be understood.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /design/{configId}:
    get:
      operationId: getDesign
      summary: Load a stored design, repriced at current prices.
      parameters:
        - name: configId
          in: path
          required: true
          schema: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: The stored wall, goal and layout, priced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '404':
          description: No design with that code.
components:
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Obstruction:
      type: object
      required: [type, startX, width, height, bottomY]
      properties:
        type:
          type: string
          enum: [ElectricalPanel, WaterHeater, Window, SideDoor, GarageDoorTrack, Outlet]
        startX: { type: number, format: double }
        width: { type: number, format: double }
        height: { type: number, format: double }
        bottomY: { type: number, format: double }
    Wall:
      type: object
      required: [length, ceiling]
      properties:
        length: { type: number, format: double, description: Wall length in inches. }
        ceiling:
          type: number
          format: double
          description: >
            Ceiling height in inches. Required, not defaulted: assuming 96 on an older 84 inch
            garage quotes tall cabinets that do not fit.
        obstructions:
          type: array
          items: { $ref: '#/components/schemas/Obstruction' }
    PlacedItem:
      type: object
      required: [sku, x, y, width, height, depth, zone]
      properties:
        sku:
          type: string
          description: >
            Empty for a KneeSpace. Vendor "-SF" aliases (MV-B24-SF, MV-B30-SF) are accepted on the
            way in and resolved to the canonical "-F" SKU; responses always use canonical SKUs.
        x: { type: number, format: double }
        y: { type: number, format: double }
        width: { type: number, format: double }
        height: { type: number, format: double }
        depth: { type: number, format: double }
        zone:
          type: string
          enum: [Base, Counter, Wall, Tall, Filler, KneeSpace]
          description: >
            KneeSpace is an open gap in a counter run, 24 or 30 inches wide, with a base cabinet on
            each side. It is not a product: its sku is empty and it never appears in lineItems.
    Layout:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlacedItem' }
        label: { type: string, nullable: true }
        configId: { type: string, nullable: true }
        tier:
          type: string
          enum: [Standard, Premiere]
          nullable: true
          description: Defaults to Standard when omitted.
    LineItem:
      type: object
      properties:
        sku: { type: string }
        name: { type: string, description: Catalogue description, for the parts table. }
        quantity: { type: integer }
        unitList: { type: number, format: double }
        unitPromo: { type: number, format: double }
        extendedList: { type: number, format: double }
        extendedPromo: { type: number, format: double }
    PricedLayout:
      type: object
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
        subtotalList: { type: number, format: double }
        subtotalPromo: { type: number, format: double }
    Goal:
      type: string
      enum: [Workbench, Storage, HideTheMess, Balanced]
    SolveRequest:
      type: object
      required: [wall, goal]
      properties:
        wall: { $ref: '#/components/schemas/Wall' }
        goal: { $ref: '#/components/schemas/Goal' }
    SolveResponse:
      type: object
      properties:
        options:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/LayoutOption' }
        failure:
          nullable: true
          type: object
          properties:
            code:
              type: string
              enum: [WallTooShort, CeilingTooLow, NoLayoutFits]
            message: { type: string }
        notices:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum: [TallsExcludedLowCeiling, TallsNeedTipUpRoom, ObstructionsWorthADesignerLook]
                description: >
                  TallsNeedTipUpRoom means the ceiling clears an 84" pantry standing but not tilting it
                  upright. ObstructionsWorthADesignerLook means the wall has a clearance rule on it and
                  the customer should be offered a designer.
              message: { type: string }
    CartHandoff:
      type: object
      properties:
        configId: { type: string, nullable: true }
        ready:
          type: boolean
          description: False when any SKU has no product id. No requests are returned in that case.
        unmappedSkus:
          type: array
          items: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
              productId: { type: integer }
        requests:
          type: array
          description: Post these in order, same-origin, then send the customer to cartUrl.
          items:
            type: object
            properties:
              url: { type: string, example: /addproducttocart/catalog/101/1/2 }
              method: { type: string, example: POST }
        cartUrl: { type: string }
        storeOrigin:
          type: string
          description: >
            The origin these requests must be posted from. nopCommerce identifies the cart by session
            cookie, so a page served from anywhere else cannot add to it. Clients must compare this
            against their own origin before posting.
    LayoutOption:
      type: object
      description: >
        One footprint at two price points. Standard and Premiere place the same boxes in the same
        positions; only the base cabinets, and therefore the price, differ.
      properties:
        label: { type: string, example: Recommended }
        standard: { $ref: '#/components/schemas/PricedLayout' }
        premiere: { $ref: '#/components/schemas/PricedLayout' }
    ValidateRequest:
      type: object
      required: [layout, wall]
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
        wall: { $ref: '#/components/schemas/Wall' }
    ValidateResponse:
      type: object
      properties:
        violations:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              sku: { type: string, nullable: true }
    PriceRequest:
      type: object
      required: [layout]
      properties:
        layout: { $ref: '#/components/schemas/Layout' }
    SaveDesignRequest:
      type: object
      required: [wall, goal, layout]
      properties:
        wall: { $ref: '#/components/schemas/Wall' }
        goal: { $ref: '#/components/schemas/Goal' }
        layout: { $ref: '#/components/schemas/Layout' }
    DesignResponse:
      type: object
      properties:
        configId: { type: string }
        wall: { $ref: '#/components/schemas/Wall' }
        goal: { $ref: '#/components/schemas/Goal' }
        design: { $ref: '#/components/schemas/PricedLayout' }
        savedAtUtc: { type: string, format: date-time }
